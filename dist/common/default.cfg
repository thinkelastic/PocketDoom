# PocketDoom default.cfg
# Lines starting with # are ignored.
#
# --- Controls ---
# Default button mapping (Analogue Pocket):
#   D-Pad          Move / strafe
#   A (right)      Fire            key_fire     157
#   B (down)       Use / Open      key_use       32
#   X (top)        Next weapon     key_r2       240
#   Y (left)       Prev weapon     key_l2       241
#   L1             Strafe left     key_l1        44
#   R1             Strafe right    key_r1        46
#   L2             Prev weapon     key_l2       241
#   R2             Next weapon     key_r2       240
#   Start          Menu (Escape)
#   Select         Automap (Tab)
#
# In menus: R1/R2 = accept, L1/L2 = back
# Always-run is enabled by default.
#
# Key codes: 32=space, 44=comma, 46=period,
#   157=fire(ctrl), 172=left, 173=up, 174=right,
#   175=down, 182=shift(run), 184=alt(strafe),
#   240=weapon_up, 241=weapon_down
#
